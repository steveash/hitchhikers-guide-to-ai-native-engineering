name: Assayer (PR Quality Gate)

# Reviews source-note, guide-update, and feed-candidate PRs against the
# standards in agents/ASSAYER.md. Posts a review comment with the verdict
# and pass/fails the check based on whether the Assayer approved.
#
# Triggered two ways:
#
#   1. pull_request events (opened/synchronize/reopened/labeled) — for
#      PRs created or pushed by humans or via GITHUB_TOKEN paths that
#      reliably trigger workflows.
#
#   2. workflow_dispatch with a pr_number input — invoked explicitly
#      by the Miner / Smith / etc. after they create or push to a PR.
#      This is the primary path for bot-created PRs because GitHub
#      silently rate-limits pull_request webhook delivery when many
#      events come from the same user/PAT in close succession (we hit
#      this constantly in steady state; ~35% stuck rate, observed
#      directly: pos-2-of-2 PRs in a batch stuck 47% of the time,
#      and synchronize events from empty-commit pushes were also
#      dropped). Explicit workflow_dispatch is not subject to webhook
#      rate-limiting.
#
# Branch protection should require the "assayer" check to pass before
# merging any PR with the source-note, guide-update, or feed-candidate label.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write                # auto-merge closes linked source issues
  checks: write
  id-token: write              # required by anthropics/claude-code-action OIDC auth
  actions: write               # auto-rework Smith dispatches Assayer for the next round

concurrency:
  group: assayer-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  # Do NOT cancel in-progress reviews. A PR commonly receives several events
  # in quick succession (opened -> bot workflow_dispatch -> synchronize), and
  # cancel-in-progress:true killed the running Assayer before it could render
  # a verdict — the root cause of the 2026-06 backlog, where 53 of 54 PRs had
  # no final verdict (CANCELLED) and fell to a human gate. Letting every run
  # finish means each (PR, push) reliably gets a verdict; a redundant duplicate
  # run is far cheaper than a dropped one.
  cancel-in-progress: false

jobs:
  prepare:
    # Fetch PR data once via API and expose as job outputs. This lets
    # the downstream review job work the same way whether the trigger
    # was a pull_request event or an explicit workflow_dispatch.
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      labels: ${{ steps.pr.outputs.labels }}
      should_run: ${{ steps.pr.outputs.should_run }}
    steps:
      - name: Resolve PR data
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PR_NUM="${{ inputs.pr_number }}"
          else
            PR_NUM="${{ github.event.pull_request.number }}"
          fi

          if [[ -z "$PR_NUM" ]]; then
            echo "No PR number to resolve."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DATA=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUM")
          HEAD_SHA=$(echo "$DATA" | jq -r .head.sha)
          HEAD_REF=$(echo "$DATA" | jq -r .head.ref)
          BASE_REF=$(echo "$DATA" | jq -r .base.ref)
          LABELS=$(echo "$DATA" | jq -c '[.labels[].name]')
          STATE=$(echo "$DATA" | jq -r .state)

          if [[ "$STATE" != "open" ]]; then
            echo "PR #$PR_NUM is $STATE, skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only review PRs that carry one of the labels we gate on.
          SHOULD_RUN=false
          if echo "$LABELS" | jq -e 'any(.[]; . == "source-note" or . == "guide-update" or . == "feed-candidate")' >/dev/null; then
            SHOULD_RUN=true
          fi

          echo "Resolved PR #$PR_NUM head=$HEAD_REF@${HEAD_SHA:0:8} base=$BASE_REF state=$STATE should_run=$SHOULD_RUN"
          echo "Labels: $LABELS"

          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "labels=$LABELS" >> "$GITHUB_OUTPUT"
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

  assayer:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Compute PR diff against base
        run: |
          git fetch origin "${{ needs.prepare.outputs.base_ref }}"
          git diff "origin/${{ needs.prepare.outputs.base_ref }}...HEAD" > /tmp/pr.diff
          echo "Diff size: $(wc -l < /tmp/pr.diff) lines"

      - name: Load Assayer role into APPEND_SYSTEM_PROMPT
        # Cache the ~600-line role definition in the system-prompt prefix
        # so it hits the prompt cache across runs (5-min TTL window).
        run: |
          {
            echo 'APPEND_SYSTEM_PROMPT<<APPEND_EOF'
            cat agents/ASSAYER.md
            echo 'APPEND_EOF'
          } >> "$GITHUB_ENV"

      - name: Run Assayer review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot]"
          show_full_output: true
          prompt: |
            You are the Assayer. Read agents/ASSAYER.md for your role,
            review standards, and required output format.

            The pull request diff is at /tmp/pr.diff. The PR labels are:
            ${{ needs.prepare.outputs.labels }}

            Pick the review standards that apply:
            - source-note label     → "Review Standards for Source Note PRs"
            - guide-update label    → "Review Standards for Guide Update PRs"
            - feed-candidate label  → "Review Standards for Feed Candidate PRs"

            You may read any file in the repository to verify citations,
            cross-references, and contradictions. Do NOT edit any files.

            ## Human reviewer context

            Before reviewing, check for human reviewer comments on this PR:

              gh api "repos/${{ github.repository }}/issues/${{ needs.prepare.outputs.pr_number }}/comments" \
                --paginate --jq '.[] | select(.user.type != "Bot") | "[\(.user.login) \(.created_at)]: \(.body)"'
              gh api "repos/${{ github.repository }}/pulls/${{ needs.prepare.outputs.pr_number }}/comments" \
                --paginate --jq '.[] | select(.user.type != "Bot") | "[\(.user.login) on \(.path):\(.line // "?")]: \(.body)"'
              gh api "repos/${{ github.repository }}/pulls/${{ needs.prepare.outputs.pr_number }}/reviews" \
                --paginate --jq '.[] | select(.user.type != "Bot") | select(.body != null and .body != "") | "[\(.user.login) review \(.state)]: \(.body)"'

            If human reviewers have left feedback, treat their comments
            as authoritative editorial direction. Do NOT flag issues that
            the human has explicitly accepted or requested. If the human
            said "tone this down" and the Smith toned it down, that change
            is correct even if the source note says otherwise — the human
            reviewer outranks the source note on editorial judgment.

            Write your review to /tmp/assayer-review.md using the exact
            "Review Output Format" template from agents/ASSAYER.md. The
            verdict line MUST be one of:
              **Verdict**: APPROVE
              **Verdict**: REQUEST CHANGES
              **Verdict**: REJECT

            IMPORTANT: You MUST write the review file using a Bash command
            (e.g. cat > /tmp/assayer-review.md <<'EOF' ... EOF), NOT the
            Write tool. The Write tool runs in a sandbox and the file will
            not be visible to subsequent workflow steps.

            Then exit.
          claude_args: |
            --model sonnet
            --max-turns 25
            --allowedTools "Bash(*)" "Read" "Glob" "Grep" "WebFetch"

      - name: Post review and set check verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        run: |
          if [ ! -s /tmp/assayer-review.md ]; then
            echo "Assayer did not produce a review file. Failing check."
            {
              echo "## Assayer Review"
              echo ""
              echo "**Verdict**: REJECT"
              echo ""
              echo "The Assayer agent failed to produce a review. Check the workflow logs."
            } > /tmp/assayer-review.md
          fi

          # Append a command cheatsheet on non-approve verdicts so the
          # maintainer doesn't have to remember the rework triggers.
          # Use echo statements (not a heredoc) — a column-1 "---" inside
          # a YAML block scalar is parsed as a YAML document separator
          # and breaks the workflow at startup.
          if ! grep -Eq '^\*\*Verdict\*\*:[[:space:]]*APPROVE' /tmp/assayer-review.md; then
            {
              echo ""
              echo "----"
              echo ""
              echo "<details><summary><b>Maintainer commands</b> — comment one of these to act on this review</summary>"
              echo ""
              echo "- \`/rework\` — Smith reads all human comments on this PR and pushes incremental fixes to the branch. Add specific guidance in the same comment (the workflow filters out bot comments, so the Assayer review above is not visible to the Smith — paste the issues you want addressed)."
              echo "- \`/rebase\` — Smith resets the branch to current \`main\` and re-synthesizes from the original source notes plus your feedback. Use when the PR has merge conflicts or the guide has diverged."
              echo ""
              echo "Either command also clears the \`rework-attempted\` label so one more automated rework cycle can run after this one."
              echo "</details>"
            } >> /tmp/assayer-review.md
          fi

          gh pr comment "$PR_NUMBER" --body-file /tmp/assayer-review.md

          if grep -Eq '^\*\*Verdict\*\*:[[:space:]]*APPROVE' /tmp/assayer-review.md; then
            echo "Assayer verdict: APPROVE"
            exit 0
          fi

          echo "Assayer verdict: REQUEST CHANGES or REJECT"
          echo "assayer_passed=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Auto-merge approved source-note PRs
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          PR_HEAD_REF: ${{ needs.prepare.outputs.head_ref }}
        run: |
          # Only auto-merge source-note PRs, not guide-update or feed-candidate
          LABELS='${{ needs.prepare.outputs.labels }}'
          if ! echo "$LABELS" | jq -e 'index("source-note")' > /dev/null 2>&1; then
            echo "Not a source-note PR; skipping auto-merge."
            exit 0
          fi
          if echo "$LABELS" | jq -e 'index("guide-update")' > /dev/null 2>&1; then
            echo "PR also has guide-update label; requires human review."
            exit 0
          fi

          # Extract issue number from branch name (miner/issue-N or
          # miner/issue-N-r<run_id> — the -r suffix was added to avoid
          # GitHub's per-branch workflow-event suppression that hits
          # recreated branches; see miner-batch.yml).
          ISSUE_NUMBER=$(echo "$PR_HEAD_REF" | sed -n 's|^miner/issue-\([0-9]\+\)\(-r[0-9]\+\)\?$|\1|p')

          # Immediate squash-merge on APPROVE. main is intentionally NOT
          # branch-protected (the gate IS this approve-only-merge logic, and a
          # required status check is incompatible with the dispatch-based review
          # path — workflow_dispatch runs don't write a check onto the PR head
          # SHA, so a required check would leave dispatch-reviewed PRs unmergeable.
          # See docs/AUTO-GATE-ROLLOUT.md). `|| true` so a transient merge hiccup
          # can't fail the job and corrupt the verdict check.
          echo "Auto-merging approved source-note PR #$PR_NUMBER"
          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch || echo "WARN: merge failed (non-fatal)"

          # Close the linked source issue
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue close "$ISSUE_NUMBER" \
              --repo "${{ github.repository }}" \
              --comment "Source note merged via PR #$PR_NUMBER. Closing."
          fi

      - name: Auto-merge approved guide-update PRs (shadow/live gated)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          # Repo variable GUIDE_AUTOMERGE controls the published-guide gate:
          #   off    (default) — never auto-merge guide PRs; a human merges.
          #   shadow           — log the decision the gate WOULD make, but
          #                      don't merge. Use this to watch the catch-rate.
          #   live             — actually auto-merge on APPROVE.
          # Roll out off -> shadow -> live as trust is established. Before
          # going live, enable a second independent fabrication-only review
          # pass (see docs/AUTO-GATE-ROLLOUT.md) — the guide is what readers
          # see, so it warrants two agreeing verdicts, not one.
          GUIDE_AUTOMERGE: ${{ vars.GUIDE_AUTOMERGE || 'off' }}
        run: |
          LABELS='${{ needs.prepare.outputs.labels }}'
          if ! echo "$LABELS" | jq -e 'index("guide-update")' > /dev/null 2>&1; then
            echo "Not a guide-update PR; nothing to do here."
            exit 0
          fi

          echo "Assayer APPROVED guide-update PR #$PR_NUMBER. Mode: $GUIDE_AUTOMERGE"
          case "$GUIDE_AUTOMERGE" in
            live)
              echo "GUIDE_AUTOMERGE=live — auto-merging."
              gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --squash \
                || echo "WARN: merge failed (non-fatal)"
              echo "- guide PR #$PR_NUMBER: **auto-merged (live)** on APPROVE" >> "$GITHUB_STEP_SUMMARY"
              ;;
            shadow)
              echo "GUIDE_AUTOMERGE=shadow — would auto-merge, but only logging."
              echo "- guide PR #$PR_NUMBER: **SHADOW** — gate would auto-merge on APPROVE (not merged)" >> "$GITHUB_STEP_SUMMARY"
              gh pr comment "$PR_NUMBER" --body "🟡 **Shadow gate**: the Assayer APPROVED this guide-update PR. In \`live\` mode it would have been auto-merged. Left open for human merge while the gate is in shadow mode." || true
              ;;
            *)
              echo "GUIDE_AUTOMERGE=off — leaving for human merge."
              echo "- guide PR #$PR_NUMBER: APPROVE (human-merge; guide auto-merge off)" >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      - name: Record gate decision summary
        if: always()
        env:
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        run: |
          # One-glance ledger line per run so the catch-rate is auditable in
          # the Actions UI without opening each PR. (Aggregated into the
          # dashboard by scripts/generate_dashboard.py — see rollout doc.)
          if [ -f /tmp/assayer-review.md ] && \
             grep -Eq '^\*\*Verdict\*\*:[[:space:]]*APPROVE' /tmp/assayer-review.md; then
            VERDICT="APPROVE"
          elif grep -Eq '^\*\*Verdict\*\*:[[:space:]]*REJECT' /tmp/assayer-review.md 2>/dev/null; then
            VERDICT="REJECT"
          else
            VERDICT="REQUEST_CHANGES"
          fi
          echo "### Assayer gate: PR #$PR_NUMBER → $VERDICT" >> "$GITHUB_STEP_SUMMARY"

      - name: Update project board (assayer verdict)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          PR_HEAD_REF: ${{ needs.prepare.outputs.head_ref }}
        run: |
          ISSUE_NUMBER=$(echo "$PR_HEAD_REF" | sed -n 's|^miner/issue-\([0-9]\+\)\(-r[0-9]\+\)\?$|\1|p')

          if [ -f /tmp/assayer-review.md ] && \
             grep -Eq '^\*\*Verdict\*\*:[[:space:]]*APPROVE' /tmp/assayer-review.md; then
            OPTION_ID="a29ada5c"   # passed
          else
            OPTION_ID="8de29e84"   # failed
          fi

          # Update the PR in the project
          .github/scripts/update-project-field.sh \
            "${{ needs.prepare.outputs.pr_number }}" \
            "PVTSSF_lAHOABIwvc4BUXvuzhBgWzI" \
            "$OPTION_ID" \
            pr

          # Update the source issue if extractable from branch name
          if [ -n "$ISSUE_NUMBER" ]; then
            .github/scripts/update-project-field.sh \
              "$ISSUE_NUMBER" \
              "PVTSSF_lAHOABIwvc4BUXvuzhBgWzI" \
              "$OPTION_ID"
          fi

      # Rework must be the LAST step. It pushes a fix commit and then
      # explicitly dispatches Assayer for the next round (push synchronize
      # events are rate-limited and unreliable; see workflow header).
      - name: Smith rework or auto-close (guide-update)
        # No human exception queue: the Smith gets up to MAX_REWORK rounds to fix
        # a flagged guide PR (each round sees the Assayer review and re-gates). On
        # a hard REJECT or after the rounds are exhausted, the PR is auto-closed —
        # the affected chapters re-synthesize on a future Smith run.
        if: |
          failure() &&
          contains(fromJSON(needs.prepare.outputs.labels), 'guide-update')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          PR_HEAD_REF: ${{ needs.prepare.outputs.head_ref }}
        run: |
          # Use PAT for git push (the user identity matters; we don't
          # rely on the resulting synchronize event because it's rate-
          # limited — we explicitly dispatch Assayer after the push).
          if [ -n "$PROJECT_PAT" ]; then
            git remote set-url origin \
              "https://x-access-token:${PROJECT_PAT}@github.com/${{ github.repository }}.git"
          fi

          # Decide: rework again, or give up and auto-close.
          if grep -Eq '^\*\*Verdict\*\*:[[:space:]]*REJECT' /tmp/assayer-review.md 2>/dev/null; then
            VERDICT="REJECT"
          else
            VERDICT="REQUEST_CHANGES"
          fi
          MAX_REWORK=3
          ATTEMPTS=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels \
            -q '[.labels[].name | select(startswith("gu-rework-"))] | length')
          echo "guide-update PR #$PR_NUMBER verdict=$VERDICT prior_rework_rounds=$ATTEMPTS"

          close_stuck() {
            gh pr close "$PR_NUMBER" --repo "${{ github.repository }}" --delete-branch \
              --comment "🛑 **Auto-closed by the Assayer gate** — $1. This guide synthesis could not reach the quality bar automatically. No action needed: the affected chapter(s) will be re-synthesized on a future Smith run when their source notes next change." || true
          }

          # Hard reject, or out of auto-rework rounds -> close. No human queue.
          if [ "$VERDICT" = "REJECT" ]; then
            close_stuck "fundamental issue (hard REJECT)"
            exit 0
          fi
          if [ "$ATTEMPTS" -ge "$MAX_REWORK" ]; then
            close_stuck "still failing after ${MAX_REWORK} rework rounds"
            exit 0
          fi

          # Otherwise: one more Smith rework round. Track the count via labels.
          NEXT=$((ATTEMPTS + 1))
          echo "Smith rework round $NEXT/$MAX_REWORK for PR #$PR_NUMBER"
          gh label create "gu-rework-$NEXT" \
            --repo "${{ github.repository }}" \
            --description "Smith guide rework round $NEXT" \
            --color "c2e0c6" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --add-label "gu-rework-$NEXT"

          # Configure git for pushing fixes
          git config user.name "hitchhiker-smith[bot]"
          git config user.email "hitchhiker-smith@users.noreply.github.com"

          # Checkout the PR branch (not detached HEAD)
          git checkout "$PR_HEAD_REF"

          # Install Claude Code CLI
          npm install -g @anthropic-ai/claude-code

          # Build rework prompt from the assayer review
          cat > /tmp/smith-rework-prompt.txt <<'REWORK_EOF'
          You are the Smith agent reworking a guide-update PR based on
          Assayer feedback. Read agents/SMITH.md for your role and quality bar.

          The Assayer reviewed this PR and requested changes. Their review
          is at /tmp/assayer-review.md — read it carefully.

          Your task:
          1. Read /tmp/assayer-review.md to understand what needs fixing.
          2. Read the files the Assayer flagged and fix ONLY what was flagged.
          3. Do NOT expand scope beyond the Assayer's feedback.
          4. Do NOT edit source-notes/, agents/, scripts/, or .github/.
          5. Commit and push your fixes to the current branch.

          After fixing:
            git add guide/ sticky-notes/
            git commit -m "smith: address assayer feedback"
            git push
          REWORK_EOF

          claude -p "$(cat /tmp/smith-rework-prompt.txt)" \
            --model opus \
            --append-system-prompt "$(cat agents/SMITH.md)" \
            --max-turns 30 \
            --output-format stream-json --verbose \
            --allowedTools "Bash(*)" "Read" "Write" "Edit" "Glob" "Grep" "WebFetch"

          # Explicitly dispatch Assayer for the next review round.
          # The git push above would normally trigger a synchronize event,
          # but GitHub silently rate-limits those (~35% of events dropped
          # in steady state). workflow_dispatch via API bypasses this.
          echo "Dispatching Assayer for the post-rework review"
          gh workflow run assayer.yml \
            --repo "${{ github.repository }}" \
            --field pr_number="$PR_NUMBER"

      # Source-note rework OR auto-reject. No human exception queue: the Miner
      # gets a few rounds to fix a flagged source note; if it's a hard REJECT or
      # still failing after MAX_REWORK rounds, the PR is auto-closed and the
      # rejection is recorded on the source issue (excluded from re-mining,
      # retryable later by removing the `extraction-rejected` label).
      - name: Source-note rework or auto-reject
        if: |
          failure() &&
          contains(fromJSON(needs.prepare.outputs.labels), 'source-note') &&
          !contains(fromJSON(needs.prepare.outputs.labels), 'guide-update')
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          PR_HEAD_REF: ${{ needs.prepare.outputs.head_ref }}
        run: |
          set -e
          MAX_REWORK=2
          REPO="${{ github.repository }}"

          if grep -Eq '^\*\*Verdict\*\*:[[:space:]]*REJECT' /tmp/assayer-review.md 2>/dev/null; then
            VERDICT="REJECT"
          else
            VERDICT="REQUEST_CHANGES"
          fi
          ISSUE_NUMBER=$(echo "$PR_HEAD_REF" | sed -n 's|^miner/issue-\([0-9]\+\)\(-r[0-9]\+\)\?$|\1|p')
          ATTEMPTS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels \
            -q '[.labels[].name | select(startswith("sn-rework-"))] | length')
          echo "Source-note PR #$PR_NUMBER verdict=$VERDICT prior_rework_attempts=$ATTEMPTS"

          reject_and_remember() {
            local reason="$1"
            echo "Auto-rejecting PR #$PR_NUMBER: $reason"
            gh pr close "$PR_NUMBER" --repo "$REPO" --delete-branch \
              --comment "🛑 **Auto-rejected by the Assayer gate** — $reason. The source note could not be brought to the quality bar automatically, so it was not included. Recorded on the source issue; remove the \`extraction-rejected\` label there to retry this source in the future." || true
            if [ -n "$ISSUE_NUMBER" ]; then
              gh label create "extraction-rejected" --repo "$REPO" \
                --description "Assayer rejected the extracted note; excluded from re-mining until this label is removed" \
                --color "b60205" 2>/dev/null || true
              gh issue edit "$ISSUE_NUMBER" --repo "$REPO" \
                --remove-label "mining-complete" --add-label "extraction-rejected" 2>/dev/null || true
              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
                --body "Source extraction **rejected** by the Assayer gate ($reason) after up to ${MAX_REWORK} automated rework attempts. The note was not included. Reopen and remove the \`extraction-rejected\` label to re-queue this source for mining later." || true
              # Close the issue: the extraction-rejected label on the closed
              # issue is the permanent record, and closing keeps the open-issue
              # count reflecting real pending work. Reopen + unlabel to retry.
              gh issue close "$ISSUE_NUMBER" --repo "$REPO" 2>/dev/null || true
            fi
          }

          # Hard reject, or out of rework attempts -> reject + remember.
          if [ "$VERDICT" = "REJECT" ]; then
            reject_and_remember "fundamental accuracy/quality issue (hard REJECT)"
            exit 0
          fi
          if [ "$ATTEMPTS" -ge "$MAX_REWORK" ]; then
            reject_and_remember "still failing after ${MAX_REWORK} rework attempts"
            exit 0
          fi

          # Otherwise: one more Miner rework round.
          NEXT=$((ATTEMPTS + 1))
          echo "Dispatching Miner rework attempt $NEXT/$MAX_REWORK for PR #$PR_NUMBER"
          if [ -n "$PROJECT_PAT" ]; then
            git remote set-url origin \
              "https://x-access-token:${PROJECT_PAT}@github.com/${REPO}.git"
          fi
          gh label create "sn-rework-$NEXT" --repo "$REPO" \
            --description "Miner rework attempt $NEXT" --color "fbca04" 2>/dev/null || true
          # Use the REST issues/labels endpoint, NOT `gh pr edit --add-label`:
          # this step runs gh as PROJECT_PAT (scopes: project, repo), and
          # `gh pr edit` issues a GraphQL query whose login/name/slug fields
          # require `read:org` — which PROJECT_PAT lacks, so it exited 1 and no
          # source-note PR could ever rework (only the REJECT path, which avoids
          # that query, worked). The REST labels endpoint needs only `repo`.
          gh api "repos/$REPO/issues/$PR_NUMBER/labels" \
            -f "labels[]=sn-rework-$NEXT" >/dev/null

          git config user.name  "hitchhiker-miner[bot]"
          git config user.email "hitchhiker-miner@users.noreply.github.com"
          git checkout "$PR_HEAD_REF"
          npm install -g @anthropic-ai/claude-code

          cat > /tmp/miner-rework-prompt.txt <<'REWORK_EOF'
          You are the Miner agent reworking a source-note PR based on Assayer
          feedback. Read agents/MINER.md for your role and the extraction bar.
          The Assayer's review is at /tmp/assayer-review.md — read it carefully.

          Your task:
          1. Read /tmp/assayer-review.md to understand exactly what was flagged.
          2. Re-fetch the source URL (in the note's front-matter) and verify the
             flagged quotes/claims against it.
          3. Fix ONLY the flagged issues, in the single source-notes/*.md file for
             this PR. Do NOT edit registry/ (it is generated), agents/, scripts/,
             or .github/.
          4. If a flagged claim genuinely is not supported by the source, make the
             note accurate by correcting or removing it — never fabricate to pass.
          5. Commit and push to the current branch:
               git add source-notes/
               git commit -m "miner: address assayer feedback"
               git push
          REWORK_EOF

          claude -p "$(cat /tmp/miner-rework-prompt.txt)" \
            --model opus \
            --append-system-prompt "$(cat agents/MINER.md)" \
            --max-turns 30 \
            --output-format stream-json --verbose \
            --allowedTools "Bash(*)" "Read" "Write" "Edit" "Glob" "Grep" "WebFetch"

          echo "Dispatching Assayer for the post-rework review"
          gh workflow run assayer.yml \
            --repo "$REPO" \
            --field pr_number="$PR_NUMBER"
