name: Rebuild source registry

# registry/sources.json is a DERIVED index of source-note front-matter, not a
# hand-edited file. Previously every miner appended its own entry to this one
# shared file, so every parallel miner PR conflicted on it — the structural
# cause of the 2026-06 54-PR backlog. Miners no longer touch it (see
# miner-batch.yml); instead this workflow rebuilds it deterministically from
# source-notes/*.md whenever notes change on main.
#
# Loop-safety: the trigger is path-filtered to source-notes/**, and the only
# file this workflow commits is registry/sources.json, so its own commit does
# not re-trigger it.

on:
  push:
    branches: [main]
    paths:
      - 'source-notes/**'
  workflow_dispatch:        # manual one-off / first cutover rebuild

permissions:
  contents: write

concurrency:
  group: registry-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PROJECT_PAT (an admin user), not GITHUB_TOKEN: the commit below is a
          # direct push to main. Once branch protection requires the assayer
          # check, the github-actions bot cannot push to main directly, but an
          # admin user bypasses it (enforce_admins=false). The [skip ci] on the
          # commit still prevents a re-trigger loop. See docs/AUTO-GATE-ROLLOUT.md.
          token: ${{ secrets.PROJECT_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml

      - name: Regenerate registry from source-note front-matter
        run: python3 scripts/build_registry.py

      - name: Commit if the index changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- registry/sources.json; then
            echo "registry/sources.json already up to date."
            exit 0
          fi
          git config user.name  "hitchhiker-registry[bot]"
          git config user.email "hitchhiker-registry@users.noreply.github.com"
          git add registry/sources.json
          git commit -m "registry: rebuild index from source-note front-matter [skip ci]"
          git push origin main
