name: Claude Code Smoke Test

# Verifies the official anthropics/claude-code-action runs successfully
# with our CLAUDE_CODE_OAUTH_TOKEN secret. This is a foundation check
# for Pipeline 1 (Living Guide Automation, hi-4yk) — every other
# automation task depends on the runner being able to invoke Claude
# Code.
#
# Trigger manually from the Actions tab to validate after token
# rotation or action upgrades.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write              # required by anthropics/claude-code-action OIDC auth

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Claude Code with a trivial prompt
        uses: anthropics/claude-code-action@v1
        with:
          # Smoke-testing OAuth-based billing (Claude Pro/Max subscription)
          # instead of pay-per-token Anthropic API. If this run succeeds,
          # we'll migrate the rest of the workflows the same way.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Print exactly one line: "hitchhiker smoke test ok".
            Do not edit any files. Do not run any tools beyond what
            is needed to print that line. Then exit.
          claude_args: |
            --max-turns 2
            --allowedTools "Bash(*)"
